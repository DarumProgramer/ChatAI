
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101426">
  <title>ChatAi - Your Smart AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101426;
      color: #fff;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      border-bottom: 1px solid #293047;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #a78bfa;
    }

    .status {
      font-size: 12px;
      color: #86efac;
    }

    main {
      max-width: 750px;
      margin: 65px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #a5aec4;
      margin-bottom: 35px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .tool {
      background: #1c2540;
      border: 1px solid #303b5c;
      padding: 20px 10px;
      border-radius: 14px;
      color: white;
      font-size: 15px;
    }

    .tool span {
      display: block;
      font-size: 27px;
      margin-bottom: 10px;
    }

    .chat {
      background: #1c2540;
      border: 1px solid #303b5c;
      border-radius: 16px;
      padding: 15px;
    }

    #output {
      text-align: left;
      min-height: 45px;
      margin-bottom: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #394563;
      border-radius: 10px;
      background: #101426;
      color: white;
      outline: none;
    }

    button {
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 17px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      color: #77829b;
      text-align: center;
      font-size: 12px;
      padding: 25px;
    }

    @media (max-width: 400px) {
      h1 { font-size: 27px; }
      .tool { padding: 15px 5px; }
      button { padding: 10px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">✦ ChatAi</div>
    <div class="status">● Online</div>
  </header>

  <main>
    <h1>Apa yang bisa saya bantu?</h1>
    <p class="subtitle">
      Your Smart AI Assistant
    </p>

    <div class="tools">
      <div class="tool">
        <span>💬</span>AI Chat
      </div>
      <div class="tool">
        <span>✍️</span>AI Writer
      </div>
      <div class="tool">
        <span>🌐</span>Translator
      </div>
      <div class="tool">
        <span>📚</span>AI Edukasi
      </div>
    </div>

    <div class="chat">
      <div id="output">
        Selamat datang di ChatAi! Tulis pesan untuk mencoba demo.
      </div>

      <div class="input-area">
        <input
          id="message"
          type="text"
          placeholder="Tulis pesan di sini..."
        >
        <button onclick="sendMessage()">Kirim</button>
      </div>
    </div>
  </main>

  <footer>
    © 2026 ChatAi. All rights reserved.
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const output = document.getElementById("output");
      const message = input.value.trim();

      if (!message) {
        output.textContent = "Silakan tulis pesan terlebih dahulu.";
        return;
      }

      output.textContent =
        "Pesan kamu: " + message +
        "\n\nIni masih versi demo ChatAi. AI sungguhan akan kita hubungkan pada tahap berikutnya.";

      input.value = "";
    }
  </script>
</body>
</html>
