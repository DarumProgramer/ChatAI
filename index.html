
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatAi - Smart Assistant</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101426;
 color:white;
}
header{
 padding:20px;
 background:#19213a;
 border-bottom:1px solid #303b5c;
 font-size:23px;
 font-weight:bold;
 color:#a78bfa;
}
main{
 max-width:700px;
 margin:35px auto;
 padding:16px;
}
h1{text-align:center;font-size:30px}
.desc{text-align:center;color:#a5aec4}
.tools{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin:25px 0;
}
.tool{
 background:#202b47;
 padding:18px;
 border-radius:13px;
 text-align:center;
}
.chat{
 background:#202b47;
 border-radius:15px;
 padding:15px;
}
#output{
 min-height:160px;
 max-height:350px;
 overflow-y:auto;
}
.msg{
 padding:12px;
 margin:10px 0;
 border-radius:10px;
 background:#303d5d;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.bot{background:#34415e}
.input{
 display:flex;
 gap:8px;
}
input{
 flex:1;
 min-width:0;
 padding:13px;
 border-radius:9px;
 border:1px solid #536080;
 background:#101426;
 color:white;
}
button{
 padding:12px 16px;
 border:0;
 border-radius:9px;
 background:#8b5cf6;
 color:white;
 font-weight:bold;
}
footer{
 text-align:center;
 color:#8892aa;
 padding:25px;
 font-size:12px;
}
</style>
</head>
<body>

<header>✦ ChatAi</header>

<main>
<h1>Apa yang bisa saya bantu?</h1>
<p class="desc">Your Smart AI Assistant</p>

<div class="tools">
<div class="tool">💬<br>AI Chat</div>
<div class="tool">✍️<br>AI Writer</div>
<div class="tool">🌐<br>Translator</div>
<div class="tool">📚<br>AI Edukasi</div>
</div>

<div class="chat">
<div id="output">
<div class="msg bot">
Halo! Selamat datang di ChatAi.
Silakan tulis pesan untuk memulai.
</div>
</div>

<div class="input">
<input id="message" placeholder="Tulis pesan...">
<button onclick="sendMessage()">Kirim</button>
</div>
</div>
</main>

<footer>© 2026 ChatAi</footer>

<script>

 
async function sendMessage() {
  const input = document.getElementById("message");
  const output = document.getElementById("output");
  const message = input.value.trim();

  if (!message) return;

  const user = document.createElement("div");
  user.className = "msg";
  user.textContent = "Kamu: " + message;
  output.appendChild(user);

  const bot = document.createElement("div");
  bot.className = "msg bot";
  bot.textContent = "ChatAi sedang memproses...";
  output.appendChild(bot);

  input.value = "";
  output.scrollTop = output.scrollHeight;

  try {
    const response = await fetch(
      "https://chatai-server.darum895.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      }
    );

    const data = await response.json();
    bot.textContent = "ChatAi: " + data.reply;
  } catch (error) {
    bot.textContent = "ChatAi: Koneksi server gagal.";
  }

  output.scrollTop = output.scrollHeight;
}

document.getElementById("message")
  .addEventListener("keydown", function(e) {
    if (e.key === "Enter") sendMessage();
  });

</script>

</body>
  </html>
